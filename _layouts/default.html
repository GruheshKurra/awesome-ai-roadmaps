<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{% if page.url == "/" %}{{ site.title | escape }}: one good video per AI concept{% else %}{{ page.title | escape }} · {{ site.title | escape }}{% endif %}</title>
  {% seo title=false %}
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/favicon.svg' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
</head>
<body>
  <a class="skip" href="#content">Skip to content</a>
  <header class="top">
    <a class="brand" href="{{ '/' | relative_url }}">Awesome AI Roadmaps</a>
    <nav aria-label="Site">
      <a href="{{ '/tips/' | relative_url }}">Tips</a>
      <a href="{{ '/contributing/' | relative_url }}">Contribute</a>
      <a class="star" href="https://github.com/GruheshKurra/awesome-ai-roadmaps">Star on GitHub</a>
    </nav>
  </header>
  <main id="content" tabindex="-1">
    {% unless content contains '<h1' %}<h1>{{ page.title | escape }}</h1>{% endunless %}
    {{ content }}
  </main>
  <footer>Free resources, checked daily. <a href="https://github.com/GruheshKurra/awesome-ai-roadmaps/issues/new/choose">Suggest a better pick</a>.</footer>
</body>
</html>
