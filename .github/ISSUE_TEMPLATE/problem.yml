name: Report a problem
description: A dead video, a missing repo, a step in the wrong order, or a website bug.
title: "Problem: "
body:
  - type: input
    id: where
    attributes:
      label: Roadmap and step (or page URL)
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Problem
      options:
        - Video removed or unavailable
        - Repo missing or archived
        - Video doesn't match the step
        - Step order or prerequisite is confusing
        - Website bug
        - Other
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: What happened?
    validations:
      required: true
