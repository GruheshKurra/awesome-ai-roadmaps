name: Suggest a resource
description: Recommend a specific free video, paper, article, or chapter.
title: "Resource: "
body:
  - type: input
    id: track
    attributes:
      label: Concept
      description: Which concept is this for? Name the README row it would replace, or the gap it fills.
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Resource URL
      description: Link directly to the video or reading.
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Why this resource?
      description: Explain what it teaches and why it is better than the current pick.
    validations:
      required: true
  - type: checkboxes
    id: access
    attributes:
      label: Access
      options:
        - label: The learning material is available without payment or a paid trial.
          required: true
