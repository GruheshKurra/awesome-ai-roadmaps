name: Suggest a video or repo
description: Recommend a better YouTube video or GitHub repo for a roadmap step, or a new roadmap.
title: "Suggestion: "
body:
  - type: input
    id: roadmap
    attributes:
      label: Roadmap and step
      description: For example "AI Agents & MCP, step 7", or "New roadmap".
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: YouTube video or GitHub repo URL
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Why is it better?
      description: What does it explain more clearly, more correctly, or more currently than the current pick? Say if you made it or are affiliated with it.
    validations:
      required: true
  - type: checkboxes
    id: access
    attributes:
      label: Access
      options:
        - label: It is free to watch or use, with no paid course or sign-up wall.
          required: true
