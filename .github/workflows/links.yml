name: Check links

on:
  schedule:
    - cron: "0 6 * * 1"
  pull_request:
    paths: ["README.md", "tracks/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          # 403/429 usually mean bot protection, not a dead page.
          args: >-
            --no-progress --max-concurrency 8 --retry-wait-time 5
            --accept 200,202,206,403,429
            --exclude "github.com/.*/stargazers"
            README.md "tracks/**/*.md"
          fail: true
