<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    .bg { fill: #0d0c10; }
    .bar { fill: #faf8f4; }
    .bar-accent { fill: #b7acff; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #faf8f4; }
      .bar { fill: #0d0c10; }
      .bar-accent { fill: #4a3ad1; }
    }
  </style>
  <rect class="bg" width="32" height="32" rx="7"/>
  <rect class="bar" x="7" y="18" width="4" height="7" rx="1"/>
  <rect class="bar" x="14" y="13" width="4" height="12" rx="1"/>
  <rect class="bar-accent" x="21" y="7" width="4" height="18" rx="1"/>
</svg>
