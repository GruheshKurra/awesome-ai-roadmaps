title: Awesome AI Roadmaps
description: Free ranked AI learning paths. Each track is a table of concepts.
url: https://gruheshkurra.github.io
baseurl: /awesome-ai-roadmaps

twitter:
  card: summary_large_image

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

plugins:
  - jekyll-relative-links
  - jekyll-optional-front-matter
  - jekyll-readme-index
  - jekyll-default-layout
  - jekyll-titles-from-headings
  - jekyll-github-metadata
  - jekyll-seo-tag
  - jekyll-sitemap

relative_links:
  enabled: true
  collections: true

readme_index:
  enabled: true

optional_front_matter:
  enabled: true

titles_from_headings:
  enabled: true
  strip_title: true

defaults:
  - scope:
      path: ""
    values:
      layout: default
      image:
        path: /assets/og-image.png
        width: 1200
        height: 630

track_nav:
  - slug: python-for-ml
    label: Python for ML
  - slug: math-for-ml
    label: Math for ML
  - slug: nlp
    label: NLP
  - slug: ml-basics
    label: ML Basics
  - slug: deep-learning
    label: Deep Learning
  - slug: computer-vision
    label: Computer Vision
  - slug: llms
    label: LLMs
  - slug: from-scratch
    label: From Scratch
  - slug: eval-harnesses
    label: Eval Harnesses
  - slug: rag
    label: RAG
  - slug: agents-tooling
    label: Agents & Tooling
  - slug: ai-tools
    label: AI Tools
  - slug: prompt-context
    label: Prompting & Context
  - slug: fine-tuning
    label: Fine-Tuning

exclude:
  - LICENSE
  - CODE_OF_CONDUCT.md
  - AGENTS.md
  - tracker.md
  - .gitignore
  - .github
