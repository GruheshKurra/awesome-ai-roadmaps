title: Awesome AI Roadmaps
description: Free AI and machine learning roadmaps. Learn Python, math, deep learning, LLMs, and AI safety through ordered videos, papers, and chapters.
repository: GruheshKurra/awesome-ai-roadmaps
lang: en
url: https://gruheshkurra.github.io
baseurl: /awesome-ai-roadmaps

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

plugins:
  - jekyll-relative-links
  - jekyll-optional-front-matter
  - jekyll-readme-index
  - jekyll-default-layout
  - jekyll-titles-from-headings
  - jekyll-github-metadata
  - jekyll-seo-tag
  - jekyll-sitemap

relative_links:
  enabled: true
  collections: true

readme_index:
  enabled: true

optional_front_matter:
  enabled: true

titles_from_headings:
  enabled: true
  strip_title: true

defaults:
  - scope:
      path: ""
    values:
      layout: default
      image:
        path: /assets/og-image.png
        width: 1730
        height: 909
        alt: Awesome AI Roadmaps. Free AI/ML learning paths with specific videos, papers, and chapters.

  # BEGIN CATALOG DESCRIPTIONS
  - scope:
      path: tracks/python-for-ml
    values:
      description: "Python for ML roadmap: NumPy, notebooks, pandas, plots. Free videos, papers, and chapters in learning order."
  - scope:
      path: tracks/math-for-ml
    values:
      description: "Math for ML roadmap: Linear algebra, calculus, probability, optimization. Free videos, papers, and chapters in learning order."
  - scope:
      path: tracks/nlp
    values:
      description: "NLP roadmap: Word vectors through BERT. Free videos, papers, and chapters in learning order."
  - scope:
      path: tracks/ml-basics
    values:
      description: "ML Basics roadmap: Regression, trees, SVM, clustering. Free videos, papers, and chapters in learning order."
  - scope:
      path: tracks/deep-learning
    values:
      description: "Deep Learning roadmap: Backprop, CNNs, RNNs, optimization. Free videos, papers, and chapters in learning order."
  - scope:
      path: tracks/computer-vision
    values:
      description: "Computer Vision roadmap: CNNs, detection, segmentation, ViT. Free videos, papers, and chapters in learning order."
  - scope:
      path: tracks/llms
    values:
      description: "LLMs roadmap: Transformers, GPT family, scaling, RLHF. Free videos, papers, and chapters in learning order."
  - scope:
      path: tracks/from-scratch
    values:
      description: "From Scratch roadmap: Autograd, tokenizers, GPT, all hand-built. Free videos, papers, and chapters in learning order."
  - scope:
      path: tracks/eval-harnesses
    values:
      description: "Eval Harnesses roadmap: Benchmarks, contamination, SWE-bench, LLM-as-judge. Free videos, papers, and chapters in learning order."
  - scope:
      path: tracks/rag
    values:
      description: "RAG roadmap: Embeddings, chunking, vector search, eval. Free videos, papers, and chapters in learning order."
  - scope:
      path: tracks/agents-tooling
    values:
      description: "Agents & Tooling roadmap: Tool use, ReAct, memory, browser/computer-use. Free videos, papers, and chapters in learning order."
  - scope:
      path: tracks/ai-tools
    values:
      description: "AI Tools roadmap: Cursor, Claude Code, local models, MCP, playgrounds. Free videos, papers, and chapters in learning order."
  - scope:
      path: tracks/prompt-context
    values:
      description: "Prompting & Context roadmap: Prompt structure, chain-of-thought, context engineering. Free videos, papers, and chapters in learning order."
  - scope:
      path: tracks/fine-tuning
    values:
      description: "Fine-Tuning roadmap: LoRA, QLoRA, DPO, data for adapters. Free videos, papers, and chapters in learning order."
  - scope:
      path: tracks/speech-audio
    values:
      description: "Speech & Audio roadmap: Spectrograms, CTC, wav2vec, Whisper, TTS. Free videos, papers, and chapters in learning order."
  - scope:
      path: tracks/multimodal
    values:
      description: "Multimodal roadmap: CLIP, Flamingo, BLIP-2, LLaVA, ImageBind. Free videos, papers, and chapters in learning order."
  - scope:
      path: tracks/generative-models
    values:
      description: "Generative Models roadmap: VAE, GAN, flows, diffusion, flow matching. Free videos, papers, and chapters in learning order."
  - scope:
      path: tracks/reinforcement-learning
    values:
      description: "Reinforcement Learning roadmap: MDPs, Q-learning, DQN, policy gradients, PPO, SAC. Free videos, papers, and chapters in learning order."
  - scope:
      path: tracks/graph-ml
    values:
      description: "Graph ML roadmap: Node embeddings, GCN, GraphSAGE, GAT, GIN, TransE. Free videos, papers, and chapters in learning order."
  - scope:
      path: tracks/recsys
    values:
      description: "Recommender Systems roadmap: Collaborative filtering, matrix factorization, Wide & Deep, two-tower, SASRec. Free videos, papers, and chapters in learning order."
  - scope:
      path: tracks/time-series
    values:
      description: "Time Series roadmap: Stationarity, ARIMA, ETS, DeepAR, N-BEATS, TFT, Informer, PatchTST. Free videos, papers, and chapters in learning order."
  - scope:
      path: tracks/causal-ml
    values:
      description: "Causal ML roadmap: Potential outcomes, DAGs, propensity scores, double ML, LATE, causal forests. Free videos, papers, and chapters in learning order."
  - scope:
      path: tracks/interpretability
    values:
      description: "Interpretability roadmap: Permutation importance, PDP, LIME, SHAP, Grad-CAM, TCAV, circuits. Free videos, papers, and chapters in learning order."
  - scope:
      path: tracks/evals-safety
    values:
      description: "Evals & Safety roadmap: Alignment, specification gaming, jailbreaks, red teaming, safety evals. Free videos, papers, and chapters in learning order."
  - scope:
      path: tracks/data-centric
    values:
      description: "Data-Centric AI roadmap: Datasheets, labeling, weak supervision, label errors, synthetic data, filtering. Free videos, papers, and chapters in learning order."
  # END CATALOG DESCRIPTIONS

