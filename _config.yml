title: Awesome AI Roadmaps
description: One good free video or article for each AI concept, from math and deep learning to LLMs, agents and RAG. Picked for clarity, not fame.
repository: GruheshKurra/awesome-ai-roadmaps
lang: en
url: https://gruheshkurra.github.io
baseurl: /awesome-ai-roadmaps

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

plugins:
  - jekyll-relative-links
  - jekyll-optional-front-matter
  - jekyll-readme-index
  - jekyll-default-layout
  - jekyll-titles-from-headings
  - jekyll-seo-tag
  - jekyll-sitemap

relative_links:
  enabled: true

readme_index:
  enabled: true

optional_front_matter:
  enabled: true

titles_from_headings:
  enabled: true
  strip_title: true

defaults:
  - scope:
      path: ""
    values:
      layout: default
      image:
        path: /assets/og-image.png

exclude:
  - memory.md
  - agent
  - data
  - growth
  - scripts
  - LICENSE
  - CODE_OF_CONDUCT.md
  - Gemfile
  - Gemfile.lock
