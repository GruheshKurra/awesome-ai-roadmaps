title: Awesome AI Roadmaps
description: Free ranked AI learning paths. Each track is a table of concepts.
url: https://gruheshkurra.github.io
baseurl: /awesome-ai-roadmaps
theme: jekyll-theme-cayman
show_downloads: false

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

plugins:
  - jekyll-relative-links
  - jekyll-optional-front-matter
  - jekyll-readme-index
  - jekyll-default-layout
  - jekyll-titles-from-headings

relative_links:
  enabled: true
  collections: true

readme_index:
  enabled: true

titles_from_headings:
  enabled: true
  strip_title: true

exclude:
  - LICENSE
  - CODE_OF_CONDUCT.md
  - .gitignore
